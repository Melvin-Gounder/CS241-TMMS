<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRA/LTA Dashboard</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><strong>FRA/LTA Authority</strong><nav><a th:href="@{/traffic}">Public view</a><form th:action="@{/logout}" method="post"><button class="link">Sign out</button></form></nav></header><main><h1>Road Authority Dashboard</h1><section class="junction-grid"><article class="junction-card" th:each="s:${statuses}"><div class="badge" th:classappend="${s.congestion}" th:text="${s.congestion}"></div><h2 th:text="${s.junction}"></h2><p>Vehicles: <b th:text="${s.vehicleCount}"></b></p><p>Occupancy: <b th:text="${s.occupancyPercent}"></b>%</p><p>Road: <b th:text="${s.roadCondition}"></b></p></article></section><h2>Incident overview</h2><div class="table-wrap"><table><tbody><tr th:each="i:${incidents}"><td th:text="${i.junction.name}"></td><td th:text="${i.status}"></td><td th:text="${i.description}"></td></tr></tbody></table></div></main></body></html>
