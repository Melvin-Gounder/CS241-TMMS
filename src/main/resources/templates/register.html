<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Registration</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth"><main class="auth-card"><h1>Public Registration</h1><p>Only public user accounts can be created here.</p><form th:action="@{/register}" th:object="${registrationForm}" method="post"><label>Full name<input th:field="*{fullName}" required></label><small th:errors="*{fullName}"></small><label>Email<input th:field="*{email}" type="email" required></label><small th:errors="*{email}"></small><label>Password<input th:field="*{password}" type="password" required></label><small th:errors="*{password}"></small><button>Create account</button></form><p th:if="${registrationError}" th:text="${registrationError}" class="error"></p><a th:href="@{/login}">Back to sign in</a></main></body></html>
