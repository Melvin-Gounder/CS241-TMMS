<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Dashboard</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><strong>TMMS Administrator</strong><nav><a th:href="@{/traffic}">Public view</a><a href="http://localhost/phpmyadmin/" target="_blank" rel="noopener">Open phpMyAdmin</a><form th:action="@{/logout}" method="post"><button class="link">Sign out</button></form></nav></header><main><h1>Administrator Dashboard</h1><section class="summary"><div><b th:text="${users.size()}"></b><span>Users</span></div><div><b th:text="${devices.size()}"></b><span>Devices</span></div><div><b th:text="${incidents.size()}"></b><span>Recent incidents</span></div></section><h2>System users</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Enabled</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${u.enabled}"></td></tr></tbody></table></div><h2>Traffic devices</h2><div class="table-wrap"><table><thead><tr><th>Junction</th><th>Device</th><th>Type</th><th>Status</th></tr></thead><tbody><tr th:each="d:${devices}"><td th:text="${d.junction.name}"></td><td th:text="${d.deviceName}"></td><td th:text="${d.deviceType}"></td><td th:text="${d.status}"></td></tr></tbody></table></div></main></body></html>
