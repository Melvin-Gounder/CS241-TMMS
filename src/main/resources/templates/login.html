<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMMS Login</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth"><main class="auth-card"><h1>Traffic Monitoring and Management System</h1><p>CS241 Assignment 2 — Group 16</p><form th:action="@{/login}" method="post"><label>Email<input name="username" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form><p th:if="${param.error}" class="error">Invalid email or password.</p><p th:if="${param.registered}" class="ok">Registration complete. You can sign in.</p><p><a th:href="@{/register}">Public sign-up</a> · <a th:href="@{/traffic}">View public traffic</a></p></main></body></html>
